<!DOCTYPE html>
<html>
<head>
  <title>Advanced Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="top-bar">
    <h1>Todo App</h1>
    <button onclick="toggleDarkMode()">🌙</button>
  </div>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <button onclick="addTodo()">Add</button>
  </div>

  <p id="counter"></p>

  <div class="filters">
    <button onclick="setFilter('all')" id="filter-all">All</button>
    <button onclick="setFilter('active')" id="filter-active">Active</button>
    <button onclick="setFilter('completed')" id="filter-completed">Completed</button>
  </div>

  <button onclick="clearCompleted()">Clear Completed</button>

  <ul id="todoList"></ul>

</div>

<script>
const API = "http://localhost:5000/todos";

let currentFilter = localStorage.getItem("filter") || "all";

/* ================= LOAD THEME ================= */
if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
}

/* ================= LOAD TODOS ================= */
async function loadTodos() {
    const res = await fetch(API);
    const data = await res.json();

    const list = document.getElementById("todoList");
    list.innerHTML = "";

    data
      .filter(todo => {
          if (currentFilter === "active") return !todo.completed;
          if (currentFilter === "completed") return todo.completed;
          return true;
      })
      .forEach(todo => {
          const li = createTodoElement(todo);
          list.appendChild(li);
      });

    updateCounter();
    updateActiveFilterButton();
}

/* ================= CREATE ELEMENT ================= */
function createTodoElement(todo) {
    const li = document.createElement("li");
    li.setAttribute("draggable", true);

    if (todo.completed) li.classList.add("completed");

    li.innerHTML = `
        <div>
            <input type="checkbox"
                ${todo.completed ? "checked" : ""}
                onchange="toggleTodo(${todo.id}, this.checked)">
            <span>${todo.task}</span>
        </div>
        <button onclick="deleteTodo(${todo.id}, this)">Delete</button>
    `;

    addDragEvents(li);
    return li;
}

/* ================= ADD ================= */
async function addTodo() {
    const input = document.getElementById("taskInput");
    const task = input.value.trim();
    if (!task) return;

    const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task })
    });

    const newTodo = await res.json();
    input.value = "";
    loadTodos();
}

/* ================= DELETE ================= */
async function deleteTodo(id, btn) {
    await fetch(`${API}/${id}`, { method: "DELETE" });
    btn.closest("li").remove();
    updateCounter();
}

/* ================= TOGGLE ================= */
async function toggleTodo(id, completed) {
    await fetch(`${API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ completed })
    });

    loadTodos();
}

/* ================= FILTER ================= */
function setFilter(filter) {
    currentFilter = filter;
    localStorage.setItem("filter", filter);
    loadTodos();
}

function updateActiveFilterButton() {
    document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.remove("active-filter");
    });

    const activeBtn = document.getElementById(`filter-${currentFilter}`);
    if (activeBtn) activeBtn.classList.add("active-filter");
}

/* ================= CLEAR COMPLETED ================= */
async function clearCompleted() {
    const res = await fetch(API);
    const data = await res.json();

    const completedTasks = data.filter(todo => todo.completed);

    for (let todo of completedTasks) {
        await fetch(`${API}/${todo.id}`, { method: "DELETE" });
    }

    loadTodos();
}

/* ================= COUNTER ================= */
function updateCounter() {
    const total = document.querySelectorAll("#todoList li").length;
    const completed = document.querySelectorAll("#todoList li.completed").length;
    const remaining = total - completed;

    document.getElementById("counter").textContent =
        `${remaining} task(s) remaining`;
}

/* ================= DARK MODE ================= */
function toggleDarkMode() {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
    } else {
        localStorage.setItem("theme", "light");
    }
}

/* ================= DRAG & DROP ================= */
function addDragEvents(li) {
    li.addEventListener("dragstart", () => {
        li.classList.add("dragging");
    });

    li.addEventListener("dragend", () => {
        li.classList.remove("dragging");
    });

    const list = document.getElementById("todoList");

    list.addEventListener("dragover", e => {
        e.preventDefault();
        const dragging = document.querySelector(".dragging");
        list.appendChild(dragging);
    });
}

/* ================= INIT ================= */
loadTodos();
</script>

</body>
</html>
